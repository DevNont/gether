complexity:
  # Stateless @Composable functions take one callback per interaction and hoist all state —
  # parameter count and body length rules fit poorly there.
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
    # Repository interfaces/implementations legitimately expose 10+ methods per aggregate.
    thresholdInClasses: 20
    thresholdInInterfaces: 20
  LongParameterList:
    ignoreAnnotated: ['Composable']
    # Hilt ViewModels aggregate repositories/use cases via constructor injection.
    constructorThreshold: 10
    # NavGraphBuilder extensions take one callback per destination exit.
    functionThreshold: 10
  LongMethod:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  # Reference money-logic code (docs/04) uses early returns in Money.parse — do not rewrite it.
  ReturnCount:
    max: 4
  # Satang arithmetic (x100, /100) makes literal 100 idiomatic throughout money code.
  MagicNumber:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
