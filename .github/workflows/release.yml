name: Release APK

# Build a signed release APK and publish it to a GitHub Release whenever a
# v* tag is pushed. The APK is signed with the debug keystore (its SHA-1 is
# registered in Firebase) so Google/LINE sign-in works for testers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Real Firebase config (gitignored locally) — needed so the APK talks to
      # the live project instead of a placeholder.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      # The exact debug keystore whose SHA-1 is registered in Firebase, restored to a known path
      # and passed to Gradle via SIGNING_KEYSTORE so the release build signs with it.
      - name: Restore signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.keystore"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          # Optional — enables in-app Places Autocomplete when the secret is set; empty falls back
          # to a plain Google Maps search intent.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew assembleRelease

      # Guard against a mis-signed APK: sign-in only works with the registered SHA-1.
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          SHA1=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -i 'SHA-1' | awk '{print $NF}')
          echo "signer SHA-1: $SHA1"
          if [ "$SHA1" != "dfb9b8bfbbf6c16c5bb40b5c6368ef78274d6b41" ]; then
            echo "::error::release APK signed with an unregistered key ($SHA1); sign-in would fail"
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "TripTogether-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "TripTogether-${GITHUB_REF_NAME}.apk" \
            --title "TripTogether ${GITHUB_REF_NAME}" \
            --notes "ดาวน์โหลด APK ด้านล่างแล้วเปิดไฟล์บนมือถือเพื่อติดตั้ง (อนุญาต ติดตั้งจากแหล่งที่ไม่รู้จัก). Android 8.0+ / ต้องมีเน็ต / Sign in ด้วย Google หรือ LINE. Beta build — เซ็นด้วย debug key ไม่ใช่เวอร์ชัน Play Store."
