name: Release APK

# Build a signed release APK and publish it to a GitHub Release whenever a
# v* tag is pushed. The APK is signed with the debug keystore (its SHA-1 is
# registered in Firebase) so Google/LINE sign-in works for testers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Real Firebase config (gitignored locally) — needed so the APK talks to
      # the live project instead of a placeholder.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      # The exact debug keystore whose SHA-1 is registered in Firebase, so the
      # CI-built APK keeps a signature testers' sign-in flow accepts.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Assemble release
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "TripTogether-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "TripTogether-${GITHUB_REF_NAME}.apk" \
            --title "TripTogether ${GITHUB_REF_NAME}" \
            --notes "ดาวน์โหลด APK ด้านล่างแล้วเปิดไฟล์บนมือถือเพื่อติดตั้ง (อนุญาต ติดตั้งจากแหล่งที่ไม่รู้จัก). Android 8.0+ / ต้องมีเน็ต / Sign in ด้วย Google หรือ LINE. Beta build — เซ็นด้วย debug key ไม่ใช่เวอร์ชัน Play Store."
