name: Release APK

# Build a signed release APK and publish it to a GitHub Release whenever a
# v* tag is pushed. Signed with the dedicated release keystore; LINE login
# is a browser OIDC flow, so the signing SHA-1 does not affect sign-in.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Real Firebase config (gitignored locally) — needed so the APK talks to
      # the live project instead of a placeholder.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Optional — enables in-app Places Autocomplete when the secret is set; empty falls back
          # to a plain Google Maps search intent.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "TripTogether-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "TripTogether-${GITHUB_REF_NAME}.apk" \
            --title "TripTogether ${GITHUB_REF_NAME}" \
            --notes "ดาวน์โหลด APK ด้านล่างแล้วเปิดไฟล์บนมือถือเพื่อติดตั้ง (อนุญาต ติดตั้งจากแหล่งที่ไม่รู้จัก). Android 8.0+ / ต้องมีเน็ต / เข้าสู่ระบบด้วย LINE หรือใช้แบบไม่มีบัญชี. Beta build — ไม่ใช่เวอร์ชัน Play Store."
